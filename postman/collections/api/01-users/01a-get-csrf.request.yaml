$kind: http-request
url: "{{baseUrl}}/react/csrf/"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
        pm.response.to.have.status(200);
      });

      const csrfToken = pm.cookies.get('csrftoken');

      pm.test('CSRF cookie is set', function () {
        pm.expect(csrfToken).to.be.a('string').and.to.have.length.greaterThan(0);
      });

      pm.collectionVariables.set('csrfToken', csrfToken);
    language: text/javascript
order: 1100
