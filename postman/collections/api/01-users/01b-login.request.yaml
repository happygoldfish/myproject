$kind: http-request
url: "{{baseUrl}}/react/login/"
method: POST
headers:
  Content-Type: application/json
  X-CSRFToken: "{{csrfToken}}"
body:
  type: json
  content: |-
    {
      "username": "{{newUser}}",
      "password": "{{newUserPass}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
        pm.response.to.have.status(200);
      });

      pm.test('Response is JSON', function () {
        pm.response.to.be.json;
      });

      const data = pm.response.json();

      pm.test('Response has username', function () {
        pm.expect(data).to.have.property('username');
      });

      // Login rotates the CSRF token, refresh the stored value
      const csrfToken = pm.cookies.get('csrftoken');
      pm.collectionVariables.set('csrfToken', csrfToken);
    language: text/javascript
order: 1200
